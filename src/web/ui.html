<!doctype html>
<!--
  memento workbench — the browser half of `memento web`.

  One dependency-free document: no framework, no bundler, no CDN. It only
  talks to the local JSON API (see server.ts) with fetch. Keep it that way —
  the workbench must load in an air-gapped browser.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%236fe3d0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='11.5' fill='none' stroke='url(%23g)' stroke-width='3.4' stroke-linecap='round' stroke-dasharray='57 15.3' transform='rotate(-90 16 16)'/%3E%3Ccircle cx='16' cy='16' r='4.6' fill='url(%23g)'/%3E%3C/svg%3E" />
<title>memento — workbench</title>
<style>
  :root {
    --bg: #0d0c15;
    --panel: #16141f;
    --raise: #1c1a29;
    --line: #2a2737;
    --line-soft: #201d2e;
    --ink: #e9e7f2;
    --sub: #a8a3bd;
    --faint: #9b95b4;
    /* brand: fresh violet + water */
    --violet: #a78bfa;
    --violet-deep: #7c5cf0;
    --aqua: #6fe3d0;
    --aqua-soft: rgba(111, 227, 208, 0.12);
    --violet-soft: rgba(167, 139, 250, 0.13);
    --grad: linear-gradient(120deg, var(--violet) 0%, var(--aqua) 100%);
    /* semantic */
    --amber: #d9a15f;
    --amber-soft: rgba(217, 161, 95, 0.14);
    --green: #7fd8a4;
    --red: #e08a8a;
    --blue: #67c8e8;
    --sans: system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "Cascadia Code", Consolas, "SF Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--faint); }
  button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; border-radius: 6px; }
  body {
    background:
      radial-gradient(900px 420px at 82% -12%, rgba(124, 92, 240, 0.14), transparent 62%),
      radial-gradient(760px 340px at -8% 4%, rgba(111, 227, 208, 0.07), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font: 14px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--violet); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

  /* ---------------------------------------------------------------- shell */
  header.bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 22px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line-soft);
  }
  /* the water line — a thin gradient ribbon across the top */
  header.bar::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
    background: var(--grad); opacity: 0.85;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; font-weight: 650; letter-spacing: 0.2px; }
  .logo-mark { width: 19px; height: 19px; align-self: center; flex: none; }
  .brand .grad {
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand .ver { color: var(--faint); font: 11px var(--mono); }
  .ws-path { color: var(--faint); font: 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55vw; }

  nav.tabs { display: flex; gap: 22px; padding: 0 22px; border-bottom: 1px solid var(--line-soft); overflow-x: auto; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    flex: none; white-space: nowrap;
    padding: 11px 2px 9px; color: var(--sub); font-size: 13.5px;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  nav.tabs button:hover { color: var(--ink); }
  nav.tabs button.active { color: var(--ink); border-image: var(--grad) 1; }

  main { max-width: 1080px; margin: 0 auto; padding: 26px 22px 80px; }
  h1 { font-size: 19px; font-weight: 650; margin: 0 0 4px; }
  h2 { font-size: 14px; font-weight: 650; color: var(--sub); text-transform: uppercase; letter-spacing: 0.7px; margin: 30px 0 12px; }
  .dim { color: var(--sub); } .faint { color: var(--faint); }
  .mono { font-family: var(--mono); }
  .empty { color: var(--faint); padding: 30px 0; }

  /* -------------------------------------------------------------- overview */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 15px 16px 13px; transition: transform 0.16s ease, border-color 0.16s ease; }
  .stat:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--violet) 42%, var(--line)); }
  .stat .n { font-size: 26px; font-weight: 630; font-family: var(--mono); letter-spacing: -0.5px; }
  .stat .n small { font-size: 13px; color: var(--faint); font-weight: 400; }
  .stat .l { color: var(--sub); font-size: 12.5px; margin-top: 3px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 26px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .mini-list { display: flex; flex-direction: column; gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: 10px; overflow: hidden; }
  .mini { background: var(--panel); padding: 11px 14px; display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; }
  button.mini:hover { background: var(--raise); }
  .mini .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini .m { color: var(--faint); font: 11.5px var(--mono); white-space: nowrap; }

  /* -------------------------------------------------------------- sessions */
  table.list { width: 100%; border-collapse: collapse; }
  .table-scroll { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 10px; }
  .table-scroll table { min-width: 660px; }
  table.list th {
    text-align: left; color: var(--faint); font: 11px var(--mono); text-transform: uppercase; letter-spacing: 0.6px;
    padding: 6px 10px; border-bottom: 1px solid var(--line);
  }
  table.list td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  table.list tr.click { cursor: pointer; }
  table.list tr.click:hover td { background: var(--panel); }
  .sid { font: 12px var(--mono); color: var(--violet); }

  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font: 11px var(--mono); border: 1px solid var(--line); color: var(--sub); white-space: nowrap;
  }
  .badge.done { color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, var(--line)); }
  .badge.error { color: var(--red); border-color: color-mix(in srgb, var(--red) 35%, var(--line)); }
  .badge.aborted, .badge.max_turns { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 35%, var(--line)); }

  /* session detail timeline */
  .back { color: var(--sub); font-size: 13px; }
  .back:hover { color: var(--ink); }
  .session-head { margin: 14px 0 6px; }
  .session-head .task { font-size: 17px; font-weight: 620; margin: 6px 0; }
  .timeline { margin-top: 18px; border-left: 1px solid var(--line); padding-left: 20px; display: flex; flex-direction: column; gap: 14px; }
  .tl { position: relative; animation: rise 0.28s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .tl:nth-child(2) { animation-delay: 0.04s; } .tl:nth-child(3) { animation-delay: 0.08s; } .tl:nth-child(4) { animation-delay: 0.12s; } .tl:nth-child(5) { animation-delay: 0.16s; }
  @media (prefers-reduced-motion: reduce) { .tl { animation: none; } }
  .tl::before {
    content: ""; position: absolute; left: -25px; top: 7px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--bg); border: 2px solid var(--faint);
  }
  .tl.user::before { border-color: var(--violet); background: var(--violet-soft); }
  .tl.assistant::before { border-color: var(--aqua); background: var(--aqua-soft); }
  .tl.tool::before { border-color: var(--line); background: var(--line); }
  .tl.note::before { border-color: transparent; background: var(--faint); }
  .tl .who { font: 11px var(--mono); color: var(--faint); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 15px; }
  .card.err { border-color: color-mix(in srgb, var(--red) 45%, var(--line)); }
  .tl .card { background: transparent; }
  .toolcall { font: 12.5px var(--mono); color: var(--ink); }
  .toolcall .name { color: var(--violet); }
  details.args { margin-top: 6px; }
  details.args summary { cursor: pointer; color: var(--faint); font-size: 12px; }
  details.args pre, pre.block {
    margin: 8px 0 0; padding: 10px 12px; background: #101116; border: 1px solid var(--line-soft);
    border-radius: 8px; overflow-x: auto; font: 12px/1.5 var(--mono); color: var(--sub); white-space: pre-wrap; word-break: break-word;
  }
  .note-line { color: var(--faint); font-style: italic; font-size: 12.5px; }
  .endbar { display: flex; gap: 10px; align-items: center; color: var(--sub); font-size: 12.5px; }

  /* ---------------------------------------------------- first-run onboarding */
  .onboard { max-width: 640px; margin: 18px auto 0; }
  .onboard-hero { text-align: center; padding: 34px 20px 26px; }
  .logo-big { width: 64px; height: 64px; filter: drop-shadow(0 0 24px rgba(124, 92, 240, 0.45)); animation: breathe 3.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { .logo-big { animation: none; } }
  .onboard-hero h1 { font-size: 26px; letter-spacing: -0.4px; margin: 18px 0 8px; }
  .onboard-hero p { color: var(--sub); margin: 0 auto; max-width: 460px; }
  .steps { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .step { display: flex; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .step:hover { border-color: color-mix(in srgb, var(--violet) 45%, var(--line)); }
  .step .k {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--grad); color: #0d0c15; font: 700 14px var(--mono);
  }
  .step .body { flex: 1; min-width: 0; }
  .step .t { font-weight: 650; font-size: 14px; }
  .step .d { color: var(--faint); font-size: 12.5px; margin-top: 2px; }
  .step .cmd { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
  .step .cmd .copy { color: var(--violet); font: 11px var(--sans); font-weight: 600; }
  .step .cmd .copy:hover { color: var(--aqua); }
  @media (max-width: 640px) { .step { flex-wrap: wrap; } .step .cmd { width: 100%; padding-left: 44px; } }
  .onboard-note { color: var(--faint); text-align: center; font-size: 12.5px; margin-top: 18px; }

  /* ---------------------------------------------------------------- memory */
  .lesson { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .lesson.retired { opacity: 0.55; }
  .lesson .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lesson .text { margin: 9px 0 8px; font-size: 14px; }
  .conf { display: flex; align-items: center; gap: 8px; min-width: 150px; }
  .conf-bar { flex: 1; height: 5px; border-radius: 3px; background: var(--line-soft); overflow: hidden; }
  .conf-bar i { display: block; height: 100%; background: var(--grad); border-radius: 3px; }
  .conf-bar i.med { opacity: 0.7; } .conf-bar i.low { opacity: 0.42; } .conf-bar i.ret { background: var(--faint); }
  .conf .num { font: 12px var(--mono); color: var(--sub); width: 34px; text-align: right; }
  .meta { color: var(--faint); font: 11.5px var(--mono); display: flex; gap: 14px; flex-wrap: wrap; }
  details.evidence { margin-top: 7px; }
  details.evidence summary { cursor: pointer; color: var(--faint); font-size: 12px; }
  details.evidence ul { margin: 6px 0 2px; padding-left: 18px; color: var(--sub); font-size: 12.5px; }

  /* lesson evolution — the confidence arc drawn from the append-only log */
  details.evolution { margin-top: 9px; border-top: 1px dashed var(--line-soft); padding-top: 8px; }
  details.evolution summary { cursor: pointer; color: var(--violet); font: 11.5px var(--mono); letter-spacing: 0.3px; }
  details.evolution summary:hover { color: var(--ink); }
  .evol-wrap { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; margin-top: 9px; }
  .spark { background: var(--raise); border: 1px solid var(--line-soft); border-radius: 8px; padding: 6px 8px 2px; }
  .spark svg { display: block; }
  .spark .axis { font: 9.5px var(--mono); fill: var(--faint); }
  .evol-events { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 4px; }
  .evol-event { display: flex; gap: 9px; align-items: baseline; font-size: 12px; }
  .evol-event .dt { color: var(--faint); font: 10.5px var(--mono); min-width: 96px; }
  .evol-event .d { color: var(--sub); }
  .evol-event .d b.up { color: var(--aqua); }
  .evol-event .d b.down { color: var(--red); }
  .evol-event .d b.out { color: var(--faint); }
  .evol-event .d b.new { color: var(--violet); }

  /* resume hint on a session detail */
  .resume-hint {
    display: inline-flex; align-items: center; gap: 8px; margin: 8px 0 0;
    padding: 7px 12px; border-radius: 8px; font: 12px var(--mono);
    background: var(--violet-soft); border: 1px solid color-mix(in srgb, var(--violet) 35%, var(--line));
    color: var(--sub);
  }
  .resume-hint .cmd { color: var(--ink); }
  .resume-hint .copy { color: var(--violet); font: 11px var(--sans); font-weight: 600; }
  .resume-hint .copy:hover { color: var(--aqua); }

  /* ------------------------------------------------------------------ spec */
  .spec-grid { display: grid; grid-template-columns: 250px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 760px) { .spec-grid { grid-template-columns: 1fr; } }
  .spec-nav { position: sticky; top: 110px; display: flex; flex-direction: column; gap: 2px; }
  .spec-nav .grp { color: var(--faint); font: 10.5px var(--mono); text-transform: uppercase; letter-spacing: 0.7px; margin: 12px 0 4px; }
  .spec-nav button { text-align: left; padding: 5px 9px; border-radius: 7px; color: var(--sub); font-size: 13px; }
  .spec-nav button:hover { background: var(--panel); color: var(--ink); }
  .spec-nav button.active { background: var(--panel); color: var(--ink); box-shadow: inset 2px 0 0 var(--violet); }
  .md { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px 26px; overflow-wrap: break-word; }
  .md h1 { font-size: 21px; margin: 4px 0 14px; }
  .md h2 { font-size: 16px; margin: 22px 0 10px; text-transform: none; letter-spacing: 0; color: var(--ink); border-bottom: 1px solid var(--line-soft); padding-bottom: 5px; }
  .md h3 { font-size: 14px; margin: 18px 0 8px; }
  .md p { margin: 9px 0; }
  .md ul { margin: 8px 0; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md code { font: 12.5px var(--mono); background: var(--raise); border: 1px solid var(--line-soft); border-radius: 5px; padding: 1px 5px; }
  .md pre { background: #101116; border: 1px solid var(--line-soft); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
  .md pre code { background: none; border: 0; padding: 0; font-size: 12px; line-height: 1.55; }
  .md hr { border: 0; border-top: 1px solid var(--line-soft); margin: 20px 0; }
  .md blockquote { border-left: 3px solid var(--line); margin: 10px 0; padding: 2px 0 2px 14px; color: var(--sub); }
  .md .chk { color: var(--green); }

  /* ---------------------------------------------------------------- plugins */
  .plugin { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .plugin .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .plugin .pname { font-weight: 650; font-size: 14.5px; }
  .plugin .pname .glyph {
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-right: 6px;
  }
  .plugin .text { margin: 8px 0 6px; color: var(--sub); font-size: 13px; }
  .badge.project { color: var(--violet); border-color: color-mix(in srgb, var(--violet) 35%, var(--line)); }
  .badge.global { color: var(--aqua); border-color: color-mix(in srgb, var(--aqua) 35%, var(--line)); }
  .trust-banner {
    margin: 16px 0 6px; padding: 12px 15px; border-radius: 10px;
    background: var(--amber-soft); border: 1px solid color-mix(in srgb, var(--amber) 35%, var(--line));
    color: var(--sub); font-size: 13px;
  }
  .trust-banner b { color: var(--ink); }
  .trust-banner .mono { font-size: 12px; }

  /* ------------------------------------------------------------------ live */
  .live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--aqua); margin-left: 7px; vertical-align: 1px;
    animation: pulse 1.7s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(111, 227, 208, 0.5); }
    70% { box-shadow: 0 0 0 8px rgba(111, 227, 208, 0); }
    100% { box-shadow: 0 0 0 0 rgba(111, 227, 208, 0); }
  }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
  /* a finished card's dot rests: no pulse, dimmed to the line colour */
  .live-card:not(.running) .live-dot { animation: none; background: var(--faint); opacity: 0.65; }
  .live-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 18px; overflow: hidden; }
  .live-card.running { border-color: color-mix(in srgb, var(--aqua) 38%, var(--line)); }
  .live-card .head {
    display: flex; align-items: center; gap: 10px; padding: 12px 18px;
    border-bottom: 1px solid var(--line-soft);
    background: color-mix(in srgb, var(--violet-soft) 55%, var(--panel));
  }
  .live-card .head .task { flex: 1; min-width: 0; font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live-card .head .state { font: 11px var(--mono); color: var(--faint); white-space: nowrap; }
  .live-card.running .head .state { color: var(--aqua); }
  .live-card .body { padding: 4px 18px 16px; }
  .live-card .body .timeline { margin-top: 14px; }

  footer { color: var(--faint); font-size: 12px; text-align: center; padding: 30px 0 40px; }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6fe3d0"/></linearGradient></defs><circle cx="16" cy="16" r="11.5" fill="none" stroke="url(#logo-g)" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="57 15.3" transform="rotate(-90 16 16)"/><circle cx="16" cy="16" r="4.6" fill="url(#logo-g)"/></svg>
    <span class="grad">memento</span> <span class="ver" id="ver"></span>
  </div>
  <div class="ws-path mono" id="ws"></div>
</header>
<nav class="tabs" id="tabs">
  <button data-view="overview">Overview</button>
  <button data-view="live">Live<span class="live-dot" id="live-dot" hidden></span></button>
  <button data-view="sessions">Sessions</button>
  <button data-view="memory">Memory</button>
  <button data-view="spec">Spec</button>
  <button data-view="plugins">Plugins</button>
</nav>
<main id="main"><div class="empty">loading…</div></main>
<footer>◈ memento · the coding agent that remembers · read-only workbench · everything below lives in <span class="mono">.memento/</span></footer>

<script>
"use strict";
/* ---------------------------------------------------------------- helpers */
const $ = (sel, el) => (el || document).querySelector(sel);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = async (p) => {
  const r = await fetch(p, { headers: { accept: "application/json" } });
  if (!r.ok) throw new Error(p + " → HTTP " + r.status);
  return r.json();
};
const fmtTime = (ts) => (ts == null ? "—" : new Date(ts).toISOString().replace("T", " ").slice(0, 16));
const relTime = (ts) => {
  // ts may be a numeric epoch or an ISO string (e.g. a plugin manifest date).
  const t = typeof ts === "number" ? ts : Date.parse(ts);
  const s = Math.max(1, Math.floor((Date.now() - t) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
};
const KIND_TONE = { constraint: "var(--violet)", pattern: "var(--aqua)", failure: "var(--red)", preference: "var(--green)", discovery: "var(--sub)" };
const kindBadge = (k) => '<span class="badge" style="color:' + (KIND_TONE[k] || "var(--sub)") + '">' + esc(k) + "</span>";
const statusBadge = (s) => '<span class="badge ' + esc(s) + '">' + esc(s) + "</span>";
const confBar = (c, retired) => {
  const pct = Math.round(c * 100);
  const cls = retired ? "ret" : c >= 0.7 ? "" : c >= 0.45 ? "med" : "low";
  return '<span class="conf"><span class="conf-bar"><i class="' + cls + '" style="width:' + pct + '%"></i></span><span class="num">' + c.toFixed(2) + "</span></span>";
};
const truncate = (s, n) => (s.length > n ? s.slice(0, n) + " …" : s);

/* ------------------------------------------------- lesson evolution arc */
/** Inline SVG confidence curve — the visible "the agent gets smarter" proof. */
function sparkSvg(h, uid) {
  const W = 230, H = 48, P = 7;
  const x = (i) => P + (h.length === 1 ? (W - 2 * P) / 2 : (i * (W - 2 * P)) / (h.length - 1));
  const y = (c) => H - P - Math.max(0, Math.min(1, c)) * (H - 2 * P);
  const gid = "g" + uid;
  let dots = "";
  h.forEach((e, i) => {
    const prev = i > 0 ? h[i - 1] : null;
    const color = !prev ? "var(--violet)" : e.status === "retired" ? "var(--faint)" : e.contradicted > prev.contradicted ? "var(--red)" : e.reinforced > prev.reinforced ? "var(--aqua)" : "var(--violet)";
    dots += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(e.confidence).toFixed(1) + '" r="3.2" fill="' + color + '"><title>' + fmtTime(e.ts) + " · " + e.confidence.toFixed(2) + "</title></circle>";
  });
  const line = h.length > 1 ? '<polyline fill="none" stroke="url(#' + gid + ')" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="' +
    h.map((e, i) => x(i).toFixed(1) + "," + y(e.confidence).toFixed(1)).join(" ") + '"/>' : "";
  const first = h[0], last = h[h.length - 1];
  return '<svg width="' + W + '" height="' + H + '" role="img" aria-label="confidence arc">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="0">' +
    '<stop offset="0" stop-color="var(--violet)"/><stop offset="1" stop-color="var(--aqua)"/></linearGradient></defs>' +
    '<line x1="' + P + '" y1="' + (H - P) + '" x2="' + (W - P) + '" y2="' + (H - P) + '" stroke="var(--line)" stroke-width="1"/>' +
    line + dots +
    '<text class="axis" x="' + P + '" y="' + (H - P + 9) + '">' + fmtTime(first.ts).slice(5) + " · " + first.confidence.toFixed(2) + "</text>" +
    '<text class="axis" x="' + (W - P) + '" y="' + (H - P + 9) + '" text-anchor="end">' + fmtTime(last.ts).slice(5) + " · " + last.confidence.toFixed(2) + "</text>" +
    "</svg>";
}

/** Chronological event list — one row per point on the arc. */
function evolHtml(h) {
  const rows = h.map((e, i) => {
    const prev = i > 0 ? h[i - 1] : null;
    let d;
    if (!prev) d = "<b class='new'>created</b> at " + e.confidence.toFixed(2);
    else if (e.status === "retired" && prev.status !== "retired") d = "<b class='out'>retired</b> — left the recall pool at " + e.confidence.toFixed(2);
    else if (e.contradicted > prev.contradicted) d = "<b class='down'>−0.30 contradicted</b> → " + e.confidence.toFixed(2);
    else if (e.reinforced > prev.reinforced) d = "<b class='up'>+0.15 reinforced</b> → " + e.confidence.toFixed(2);
    else d = "confidence " + e.confidence.toFixed(2);
    return '<div class="evol-event"><span class="dt">' + fmtTime(e.ts) + '</span><span class="d">' + d + "</span></div>";
  });
  return rows.join("");
}

/** Copy-to-clipboard helper with inline feedback on the triggering button. */
function copyCmd(text, btn) {
  if (!navigator.clipboard) return;
  navigator.clipboard.writeText(text).then(() => {
    if (btn) {
      const t = btn.textContent;
      btn.textContent = "copied ✓";
      setTimeout(() => (btn.textContent = t), 1400);
    }
  }).catch(() => {});
}

/* --------------------------------------------------- mini markdown render */
function mdInline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:|#|\/)[^)]*\)/g, '$1');
}
function mdToHtml(src) {
  const lines = esc(src).split(/\r?\n/);
  const out = [];
  let inCode = false, list = null;
  const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  for (const line of lines) {
    if (/^\s*```/.test(line)) { closeList(); if (inCode) { out.push("</code></pre>"); } else { out.push("<pre><code>"); } inCode = !inCode; continue; }
    if (inCode) { out.push(line); continue; }
    if (/^\s*$/.test(line)) { closeList(); continue; }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); out.push("<h" + h[1].length + ">" + mdInline(h[2]) + "</h" + h[1].length + ">"); continue; }
    if (/^(---|\*\*\*)\s*$/.test(line)) { closeList(); out.push("<hr>"); continue; }
    if (/^&gt;\s?/.test(line)) { closeList(); out.push("<blockquote>" + mdInline(line.replace(/^&gt;\s?/, "")) + "</blockquote>"); continue; }
    const chk = line.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)$/);
    if (chk) {
      if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
      out.push('<li><span class="chk">' + (chk[1].trim() ? "✓" : "○") + "</span> " + mdInline(chk[2]) + "</li>");
      continue;
    }
    const li = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/);
    if (li) {
      if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
      out.push("<li>" + mdInline(li[1]) + "</li>");
      continue;
    }
    closeList();
    out.push("<p>" + mdInline(line) + "</p>");
  }
  closeList();
  if (inCode) out.push("</code></pre>");
  return out.join("\n");
}

function entryHtml(e) {
  if (e.kind === "header") return "";
  if (e.kind === "usage") {
    const u = e.usage;
    return '<div class="tl note"><div class="note-line">usage · ' + (u.inputTokens || 0) + " in / " + (u.outputTokens || 0) + " out</div></div>";
  }
  if (e.kind === "note") {
    return '<div class="tl note"><div class="note-line">' + esc(e.text) + "</div></div>";
  }
  if (e.kind === "compaction") {
    return '<div class="tl note"><div class="card" style="border-style:dashed"><div class="who">compaction</div><div class="dim">' +
      esc(e.replacedCount) + " messages folded into a summary (" + esc(e.tokensSaved) + " tokens saved)</div>" +
      "<details class='args'><summary>summary</summary><pre>" + esc(e.summary) + "</pre></details></div></div>";
  }
  if (e.kind === "result") {
    return '<div class="tl"><div class="endbar">' + statusBadge(e.status) + "<span>session ended after " + esc(e.turns) + " turn(s)" + (e.summary ? " · " + esc(truncate(e.summary, 120)) : "") + "</span></div></div>";
  }
  // message entries
  const msg = e.message;
  const blocks = [];
  for (const b of msg.content || []) {
    if (b.type === "text" && b.text.trim()) blocks.push("<div>" + esc(b.text) + "</div>");
    else if (b.type === "thinking" && b.text.trim()) blocks.push("<details class='args'><summary>thinking</summary><pre>" + esc(b.text) + "</pre></details>");
    else if (b.type === "toolCall") blocks.push(
      '<div class="toolcall">⏵ <span class="name">' + esc(b.name) + "</span>(" + esc(truncate(JSON.stringify(b.args || {}), 140)) + ")" +
      "<details class='args'><summary>arguments</summary><pre>" + esc(JSON.stringify(b.args, null, 2)) + "</pre></details></div>");
    else if (b.type === "toolResult") {
      const content = String(b.content || "");
      blocks.push('<div class="card' + (b.isError ? " err" : "") + '">' +
        '<div class="who">' + (b.isError ? "tool error" : "tool result") + "</div>" +
        "<pre class='block' style='margin-top:6px'>" + esc(truncate(content, 1400)) + "</pre>" +
        (content.length > 1400 ? "<details class='args'><summary>full output (" + content.length + " chars)</summary><pre>" + esc(content) + "</pre></details>" : "") +
        "</div>");
    }
  }
  if (!blocks.length) return "";
  const role = msg.role;
  const injected = msg.source && msg.source !== "user" && msg.source !== "model" ? " · injected by " + msg.source : "";
  return '<div class="tl ' + esc(role) + '"><div class="who">' + esc(role) + injected + " · " + fmtTime(msg.ts || e.ts) + "</div>" +
    '<div class="card">' + blocks.join("") + "</div></div>";
}

function lessonHtml(l, retired) {
  const uid = String(l.id).replace(/[^a-zA-Z0-9]/g, "");
  const evol = l.history && l.history.length
    ? "<details class='evolution'><summary>evolution · " + l.history.length + " point" + (l.history.length === 1 ? "" : "s") + "</summary>" +
      '<div class="evol-wrap"><div class="spark">' + sparkSvg(l.history, uid) + "</div>" +
      '<div class="evol-events">' + evolHtml(l.history) + "</div></div></details>"
    : "";
  return '<div class="lesson' + (retired ? " retired" : "") + '">' +
    '<div class="top">' + confBar(l.confidence, retired) + kindBadge(l.kind) +
      '<span class="meta" style="margin-left:auto"><span>↑' + l.reinforced + " ↓" + l.contradicted + "</span><span>" + relTime(l.lastSeen) + "</span></span></div>" +
    '<div class="text">' + esc(l.text) + "</div>" +
    '<div class="meta"><span>' + esc(l.id) + "</span>" + l.tags.slice(0, 8).map((t) => "<span>" + esc(t) + "</span>").join("") + "</div>" +
    (l.evidence && l.evidence.length ? "<details class='evidence'><summary>evidence (" + l.evidence.length + ")</summary><ul>" +
      l.evidence.map((ev) => "<li>" + esc(ev) + "</li>").join("") + "</ul></details>" : "") +
    evol +
    "</div>";
}

async function renderSpec(file) {
  setTabs("spec");
  if (!ov) ov = await api("/api/overview");
  const data = await api("/api/spec");
  const files = data.files;
  if (!files.length) {
    main().innerHTML = "<h1>Spec</h1><div class='empty'>no spec yet — run <span class='mono'>memento spec init</span> to draft one</div>";
    return;
  }
  const groups = [["constitution", "Constitution"], ["architecture", "Architecture"], ["feature", "Features"], ["decision", "Decisions"], ["other", "Other"]];
  const active = file || (files.find((f) => f.kind === "constitution") || files[0]).relPath;
  let nav = '<div class="spec-nav">';
  for (const [kind, label] of groups) {
    const fs_ = files.filter((f) => f.kind === kind);
    if (!fs_.length) continue;
    nav += '<div class="grp">' + label + "</div>";
    for (const f of fs_) {
      nav += '<button class="' + (f.relPath === active ? "active" : "") + '" onclick="location.hash=\'#/spec/' + encodeURIComponent(f.relPath) + '\'">' +
        esc(f.relPath.slice(f.relPath.lastIndexOf("/") + 1).replace(/\.md$/, "")) + "</button>";
    }
  }
  nav += "</div>";
  const doc = files.find((f) => f.relPath === active) || files[0];
  main().innerHTML = "<h1>Spec</h1><div class='dim'>" + files.length + " file(s) · the living specification the agent gates itself against</div>" +
    '<div class="spec-grid" style="margin-top:16px">' + nav + '<div class="md">' + mdToHtml(doc.content) + "</div></div>";
}

function pluginHtml(p) {
  const meta = [];
  if (p.rev) meta.push("<span>@" + esc(p.rev.slice(0, 7)) + "</span>");

  return '<div class="plugin">' +
    '<div class="top"><span class="pname"><span class="glyph">◈</span>' + esc(p.name) + "</span>" +
    '<span class="badge ' + esc(p.scope) + '">' + esc(p.scope) + "</span>" +
    '<span class="meta" style="margin-left:auto">' + meta.join("") + "</span></div>" +
    (p.description ? '<div class="text">' + esc(p.description) + "</div>" : "") +
    '<div class="meta"><span>' + esc(p.entry) + "</span><span>" + esc(p.source) + "</span></div>" +
    "</div>";
}

/* ------------------------------------------------------------------ live */
/**
 * The Live tab subscribes to /api/live (SSE): while a session runs, every
 * completed log line streams in within a tick. Entries are accumulated
 * client-side and rendered with the same timeline as the session detail,
 * so a live run looks exactly like its final replay.
 */
const liveState = { sessions: new Map(), es: null };
const currentView = () => location.hash.replace(/^#\/?/, "").split("?")[0].split("/")[0] || "overview";

function updateLiveDot() {
  let any = false;
  for (const c of liveState.sessions.values()) if (c.running) any = true;
  $("#live-dot").hidden = !any;
}

function connectLive() {
  const es = new EventSource("/api/live");
  liveState.es = es;
  es.addEventListener("live", (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    for (const s of msg.sessions || []) {
      const cur = liveState.sessions.get(s.id) || { id: s.id, task: null, running: false, entries: [] };
      for (const e of s.entries || []) {
        if (e.kind === "header") cur.task = e.task;
        if (e.kind === "result") cur.running = false;
        cur.entries.push(e);
      }
      if (s.entries && s.entries.length === 0) cur.running = s.running;
      liveState.sessions.set(s.id, cur);
    }
    // Sessions the server no longer reports: a held lock has been released.
    const seen = new Set((msg.sessions || []).map((s) => s.id));
    for (const c of liveState.sessions.values()) {
      if (c.running && !seen.has(c.id)) c.running = false;
    }
    updateLiveDot();
    if (currentView() === "live") appendLive();
  });
}

function liveCardHtml(c) {
  const entries = c.entries.map(entryHtml).filter(Boolean).join("");
  return '<div class="live-card' + (c.running ? " running" : "") + '" id="live-' + esc(c.id) + '">' +
    '<div class="head"><span class="live-dot"></span>' +
    '<span class="task">' + esc(c.task || c.id) + '</span>' +
    '<span class="state">' + (c.running ? "running" : "finished · " + relTime(c.entries.length ? c.entries[c.entries.length - 1].ts : Date.now())) + "</span>" +
    '<a href="#/sessions/' + esc(c.id) + '" class="mono" style="font-size:11px">replay →</a></div>' +
    '<div class="body"><div class="timeline" id="live-tl-' + esc(c.id) + '">' + entries + "</div></div></div>";
}

async function renderLive() {
  setTabs("live");
  if (!liveState.sessions.size) {
    main().innerHTML = "<h1>Live</h1><div class='dim'>Watch a session as it happens — open this page while <span class='mono'>memento run</span> is working in the repo.</div>" +
      '<div class="onboard" style="margin-top:26px"><div class="steps">' +
      '<div class="step"><div class="k">1</div><div class="body"><div class="t">Start a task in another terminal</div><div class="d">any memento run streams here within a second</div></div></div>' +
      '<div class="step"><div class="k">2</div><div class="body"><div class="t">Watch the agent think, call tools, and finish</div><div class="d">tool calls, answers, reflection and the final result appear live</div></div></div>' +
      '<div class="step"><div class="k">3</div><div class="body"><div class="t">Keep the tab open</div><div class="d">the dot on the Live tab pulses while a session runs</div></div></div>' +
      "</div></div>" +
      '<div class="onboard-note">waiting for the first event… this page reconnects automatically</div>';
    return;
  }
  const cards = [...liveState.sessions.values()].map(liveCardHtml).join("");
  main().innerHTML = "<h1>Live</h1><div class='dim'>Streaming from <span class='mono'>.memento/sessions</span> — what you see here is exactly what the log records.</div>" + cards;
}

/** Incremental paint: append new entries without repainting what's on screen. */
function appendLive() {
  const containers = document.querySelectorAll("[id^='live-tl-']");
  // No container yet (empty state on screen, or a fresh session): full render.
  if (!containers.length || !main().querySelector(".live-card")) {
    if (containers.length || liveState.sessions.size) renderLive();
    return;
  }
  const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;
  for (const c of liveState.sessions.values()) {
    const tl = document.getElementById("live-tl-" + c.id);
    if (!tl) { renderLive(); return; } // a brand-new session joined
    const shown = tl.children.length;
    for (let i = shown; i < c.entries.length; i++) {
      const html = entryHtml(c.entries[i]);
      if (html) tl.insertAdjacentHTML("beforeend", html);
    }
    const card = document.getElementById("live-" + c.id);
    if (card) {
      card.classList.toggle("running", c.running);
      const state = card.querySelector(".state");
      if (state) state.textContent = c.running ? "running" : "finished";
    }
  }
  if (nearBottom) window.scrollTo({ top: document.body.scrollHeight });
}

/* --------------------------------------------------------------- routing */
async function route() {
  const hashFull = location.hash.replace(/^#\/?/, "");
  // Query may ride inside the hash (`#/memory?evol`) — split it off first.
  const [hashPath, hashQuery] = hashFull.split("?");
  const parts = hashPath.split("/").map(decodeURIComponent);
  try {
    if (parts[0] === "sessions" && parts[1]) await renderSessionDetail(parts[1]);
    else if (parts[0] === "sessions") await renderSessions();
    else if (parts[0] === "live") await renderLive();
    else if (parts[0] === "memory") await renderMemory();
    else if (parts[0] === "spec") await renderSpec(parts.slice(1).join("/") || null);
    else if (parts[0] === "plugins") await renderPlugins();
    else await renderOverview();
    // `?evol` deep link: open every evolution arc (shareable "it learns" view).
    if (hashQuery && new URLSearchParams(hashQuery).has("evol")) {
      document.querySelectorAll("details.evolution").forEach((d) => (d.open = true));
    }
  } catch (err) {
    main().innerHTML = '<div class="card err" style="margin-top:20px"><div class="who">error</div>' + esc(err.message || String(err)) + "</div>";
  }
}
document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => { location.hash = "#/" + b.dataset.view; }));
window.addEventListener("hashchange", route);

(async function boot() {
  try {
    const o = await api("/api/overview");
    ov = o;
    $("#ver").textContent = "v" + o.version;
    $("#ws").textContent = o.root;
  } catch (err) {
    main().innerHTML = '<div class="card err" style="margin-top:20px">API unreachable: ' + esc(err.message) + "</div>";
    return;
  }
  connectLive();
  route();
})();
</script>
</body>
</html>
